x-app-env: &app-env
  DATABASE_URL_ASYNC: postgresql+asyncpg://${POSTGRES_USER:-pjud}:${POSTGRES_PASSWORD:-pjud}@db:5432/${POSTGRES_DB:-pjud}
  DATABASE_URL_SYNC: postgresql+psycopg://${POSTGRES_USER:-pjud}:${POSTGRES_PASSWORD:-pjud}@db:5432/${POSTGRES_DB:-pjud}
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://api-pjud.temposoft.cl}
  DOCUMENTOS_DIR: /data/documentos
  LOG_DIR: /data/logs
  SYNC_LOCK_TIMEOUT_MINUTES: ${SYNC_LOCK_TIMEOUT_MINUTES:-15}
  SYNC_MIN_INTERVAL_MINUTES: ${SYNC_MIN_INTERVAL_MINUTES:-30}
  PLAYWRIGHT_HEADLESS: "False"
  PJUD_CRED_SECRET_KEY: ${PJUD_CRED_SECRET_KEY:-}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    # El perfil seccomp "builtin" de Docker filtra syscalls por numero asumiendo un
    # kernel upstream estandar. Sobre el kernel de CentOS/RHEL 7 (3.10 con miles de
    # backports de Red Hat, numeracion de syscalls no estandar) eso bloquea llamadas
    # que Postgres necesita durante initdb (postmaster.pid, preasignacion del WAL) y
    # las devuelve como "Operation not permitted". Confirmado en produccion: con
    # seccomp=unconfined initdb corre sin problema.
    security_opt:
      - seccomp:unconfined
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pjud}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pjud}
      POSTGRES_DB: ${POSTGRES_DB:-pjud}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pjud} -d ${POSTGRES_DB:-pjud}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.api
    command: alembic upgrade head
    environment:
      <<: *app-env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - documentos:/data/documentos
      - logs:/data/logs

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    environment:
      <<: *app-env
    ports:
      - "${API_PORT:-7092}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - documentos:/data/documentos
      - logs:/data/logs

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    # PID 1 real (tini) para que Chromium (y cualquier señal de Xvfb) se manejen
    # bien sin un init de por medio -- sin esto Xvfb puede quedar arriba con
    # zombies sin recolectar.
    init: true
    # Mismo problema de seccomp vs. kernel de RHEL7 que en "db" (ver comentario ahi):
    # el sandbox propio de Chromium tambien depende de syscalls (clone/unshare/ptrace)
    # que el perfil builtin puede bloquear en este host.
    security_opt:
      - seccomp:unconfined
    environment:
      <<: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - documentos:/data/documentos
      - logs:/data/logs

volumes:
  db_data:
  documentos:
  logs:
